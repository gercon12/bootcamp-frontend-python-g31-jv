<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascada</title>
    <style>
        /*cascada se aplica el color mas abajo del codigo*/
        h2 {
            color: red;
        }

        h2 {
            color: blue;
        }

        /*especifidad se aplica el mas especifico*/
        body h1 {
            color: red;
        }
        h1 {
            color:blue;
        }

    </style>
</head>
<body>
    <h2> Estilo H2</h2>

    <h1>Estilo h1</h1>
    
</body>
</html>
