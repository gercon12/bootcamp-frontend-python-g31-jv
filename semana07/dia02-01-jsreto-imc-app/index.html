<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice de masa corporal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        @keyframes parpadeo {

            0%,
            100% {
                border-color: transparent;
            }

            50% {
                border-color: red;
            }
        }

        .borde-parpadeante {
            border: 2px solid transparent;
            animation: parpadeo 1s infinite;
        }
    </style>

</head>

<body>
    <main class=" flex justify-center align-middle">
        <section class=" imc
         flex flex-col gap-6
         w-[400px] border border-gray-200 rounded-md
         p-8">

            <h1 class="text-2xl text-center bg-slate-100 border border-gray-200 h-10">Indice de masa corporal</h1>
            <label class="flex flex-col">
                Peso (KG)
                <input
                    class="imc__peso
                    border border-gray-200 rounded-md h-12 text-2xl pl-4
                    [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                    type="number" placeholder="Ej. 50">
            </label>
            <label class="flex flex-col">
                Altura (CM)
                <input
                    class=" imc__altura
                    border border-gray-200 rounded-md h-12 text-2xl pl-4
                    [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                    type="number" placeholder="Ej. 170">
            </label>
            <button class=" imc__button
            bg-green-700 hover:bg-green-600 rounded-md h-12 text-white">Calcular</button>
            <p class="imc__Parrafo
            flex justify-center items-center
            bg-black h-14 text-white rounded-md">Tu indice de Masa Corporal
                es:&nbsp;<span class="imc__resultado font-bold"></span></p>

        </section>

    </main>
    <script src="main.js"></script>

</body>

</html>
