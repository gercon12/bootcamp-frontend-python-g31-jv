<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice de masa corporal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="flex flex-col w-[400px] border p-8 gap-6" >

        <h1 class="text-3xl">Indice de masa corporal</h1>
        <label class="flex flex-col">
            Peso (KG)
            <input  class= "border h-8" 
            type="number"  placeholder="Ej. 50">
        </label>
        <label >
            Altura (CM)
            <input class= "flex flex-col border-blue-400"
            type="number" placeholder="Ej. 170">
        </label>
        <button>Calcular</button>
    </div>
    
    
</body>
</html>
