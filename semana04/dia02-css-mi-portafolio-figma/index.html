<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi portafolio - German Contreras</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <header class="header">
        <span class="header__logo">{VV}</span>
        <nav class="header__menu">
            <a class="header::menu--active" href="">Acerca de mi</a>
            <a href="">Habilidades</a>
            <a href="">Portafolio</a>
        </nav>
        <div class="header__links">
            <img src="images/icon-github.svg" alt="Github">
            <img src="images/icon-linkedin.svg" alt="Linkedin">
        </div>


    </header>
    <main>
        <section class="hero">
            <h2 class="hero__greeting">Hola, Soy <span class="hero__greeting__span">German Contreras</span> 💪</h2>
            <h1 class="hero__title">Desarrollador web full-stack</h1>
            <p class="hero__description">Desarrollador especializado en Javascript, React.js, Vue, Python y Node.js.</p>
            <img class="hero__photo" src="https://placehold.co/400x400" alt="German Contreras Desarrollador Full Stack">
        
            <div class="stack">
                <div class="stack__wrapper">
                    <h3 class="stack__title">
                        <div class="stack__box">
                            <img src="https://placehold.co/70x70" alt="">
                        </div>
                    </h3>
                </div>
            </div>
        
        </section>
    </main>

</body>

</html>
